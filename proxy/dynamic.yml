{{ $settings := mustFromJson (env "PROXY_SETTINGS") }}
http:
  routers:
    health:
      entryPoints: [web]
      rule: 'Path(`/healthz`) && Method(`GET`)'
      service: ping@internal
{{ range $name, $url := $settings.upstreams }}
    discovery-{{ $name }}:
      entryPoints: [web]
      rule: 'PathRegexp(`^/{{ $name | regexQuoteMeta }}/([A-Za-z0-9_-][A-Za-z0-9_.-]*/)+[A-Za-z0-9_-][A-Za-z0-9_.-]*\.git/info/refs$`) && (Method(`GET`) || Method(`OPTIONS`)) && (Query(`service`, `git-upload-pack`) || Query(`service`, `git-receive-pack`))'
      middlewares: [prefix-{{ $name }}]
      service: upstream-{{ $name }}
    transfer-{{ $name }}:
      entryPoints: [web]
      rule: 'PathRegexp(`^/{{ $name | regexQuoteMeta }}/([A-Za-z0-9_-][A-Za-z0-9_.-]*/)+[A-Za-z0-9_-][A-Za-z0-9_.-]*\.git/git-(upload|receive)-pack$`) && (Method(`POST`) || Method(`OPTIONS`))'
      middlewares: [prefix-{{ $name }}]
      service: upstream-{{ $name }}
{{ end }}
{{ range $name, $client := $settings.oauthClients }}
    oauth-{{ $name }}:
      entryPoints: [web]
      rule: 'Path(`/oauth/{{ $name }}/token`) && (Method(`POST`) || Method(`OPTIONS`))'
      middlewares: [oauth-rate-limit, oauth-body-limit]
      service: oauth-helper
{{ end }}
  middlewares:
    oauth-rate-limit:
      rateLimit:
        average: 30
        period: 1m
        burst: 10
        sourceCriterion:
          ipStrategy:
            # The platform ingress appends the client IP to X-Forwarded-For.
            depth: 1
    oauth-body-limit:
      buffering:
        maxRequestBodyBytes: 8192
        maxResponseBodyBytes: 65536
    cors:
      headers:
        accessControlAllowOriginList: {{ $settings.allowedOrigins | toJson }}
        accessControlAllowMethods: {{ $settings.allowedMethods | toJson }}
        accessControlAllowHeaders: {{ $settings.allowedHeaders | toJson }}
        accessControlExposeHeaders: {{ $settings.exposedHeaders | toJson }}
        accessControlMaxAge: 600
        addVaryHeader: true
    transport-headers:
      headers:
        customRequestHeaders:
          Cookie: ""
        customResponseHeaders:
          Set-Cookie: ""
          Cache-Control: "no-store"
          X-Content-Type-Options: "nosniff"
{{ range $name, $url := $settings.upstreams }}
    prefix-{{ $name }}:
      stripPrefix:
        prefixes: ["/{{ $name }}"]
{{ end }}
  services:
{{ range $name, $url := $settings.upstreams }}
    upstream-{{ $name }}:
      loadBalancer:
        passHostHeader: false
        servers:
          - url: {{ $url | toJson }}
{{ end }}
    oauth-helper:
      loadBalancer:
        servers:
          # Sidecar container sharing the replica's network namespace.
          - url: "http://127.0.0.1:8082"
