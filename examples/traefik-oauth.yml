# Dynamic configuration; enable Traefik's file provider to load this file.
# "websecure" must already be configured with HTTPS.
http:
  routers:
    oauth-exchange:
      rule: "Path(`/oauth/exchange`) && Method(`POST`, `OPTIONS`)"
      entryPoints:
        - websecure
      tls: {}
      middlewares:
        - oauth-rate-limit
      service: oauth-helper
  middlewares:
    oauth-rate-limit:
      rateLimit:
        average: 5
        period: 1s
        burst: 10
  services:
    oauth-helper:
      loadBalancer:
        servers:
          - url: "http://oauth-helper:8081"
